name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'front/**'
      - '.github/workflows/front-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'front/**'
      - '.github/workflows/front-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    if: github.repository != 'ArtemZhyto/shared-template'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build
        env:
          MODE: prod
          NEXT_PUBLIC_SITE: <PUBLIC_FRONTEND_URL>
          NEXT_PUBLIC_API_URL: <PUBLIC_API_URL>
          API_URL: <INTERNAL_API_URL>
