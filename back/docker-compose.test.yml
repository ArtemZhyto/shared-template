services:
  <PROJECT_NAME>_test_postgres:
    image: postgres:17-alpine
    container_name: <PROJECT_NAME>_test_postgres
    environment:
      POSTGRES_USER: <POSTGRES_USER>
      POSTGRES_PASSWORD: <POSTGRES_PASSWORD>
      POSTGRES_DB: <POSTGRES_DB>_test
    ports:
      - '<POSTGRES_TEST_PORT>:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - <PROJECT_NAME>_test_postgres_data:/var/lib/postgresql/data

volumes:
  <PROJECT_NAME>_test_postgres_data:
