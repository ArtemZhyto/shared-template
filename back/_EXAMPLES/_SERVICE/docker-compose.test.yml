services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: <SERVICE_DB_NAME>_test
    ports:
      - '<SERVICE_TEST_DB_PORT>:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d <SERVICE_DB_NAME>_test']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
