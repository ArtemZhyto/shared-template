name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build
        env:
          MODE: prod
          NEXT_PUBLIC_SITE: <PUBLIC_FRONTEND_URL>
          NEXT_PUBLIC_API_URL: <PUBLIC_API_URL>
          API_URL: <INTERNAL_API_URL>
